name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck skills/explainer-video/scripts/smoke_test.sh

  smoke-test:
    name: Smoke test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test install.sh
        run: |
          mkdir -p ~/.claude/skills ~/.copilot/skills ~/.gemini/antigravity/global_skills ~/.copilot/m-skills
          bash install.sh
          bash install.sh --version
          bash install.sh --uninstall
          bash install.sh --version | grep -q "not installed" || { echo "uninstall left copies behind"; exit 1; }
          ! bash install.sh --version --uninstall
      - name: Run smoke test
        run: bash skills/explainer-video/scripts/smoke_test.sh
