<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial Component Templates</title>
<!--
  These are spatial components (diagram nodes, step chips, annotated UI mockups)
  for use in explainer videos.
  
  IMPORTANT: These templates ONLY provide spatial layout (HTML/CSS).
  They DO NOT provide timeline timing. The skill's central rule remains:
  timing must be derived from measured audio, never copied from a template.
-->
<style>
  :root {
    --ground: #f5f7fa;
    --panel: #ffffff;
    --ink: #1a2733;
    --ink-dim: #51606d;
    --accent: #0078d4;
    --hairline: #d5dde5;
    --success: #107c10;
    --warning: #d83b01;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ground);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    padding: 40px;
  }
  .component-section { margin-bottom: 60px; }
  h2 { margin-bottom: 20px; color: var(--ink-dim); }
  .canvas { position: relative; width: 1920px; height: 1080px; background: var(--ground); border: 1px solid var(--hairline); overflow: hidden; transform: scale(0.5); transform-origin: top left; }
  
  /* --------------------------------------------------------------------------
     1. STEP CHIP
     Anchors a "how-it-works" scene. Positioned top-left consistently.
  -------------------------------------------------------------------------- */
  .chip {
    position: absolute; left: 120px; top: 120px; display: block;
    width: 96px; height: 96px; border-radius: 20px; background: var(--accent);
    color: #ffffff; font-size: 44px; font-weight: 700;
    text-align: center; line-height: 96px;
    /* Entrance: tl.fromTo(".chip", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, t); */
  }
  .step-title {
    position: absolute; left: 250px; top: 142px; display: block;
    font-size: 52px; font-weight: 650;
    /* Entrance: tl.fromTo(".step-title", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, t); */
  }

  /* --------------------------------------------------------------------------
     2. DIAGRAM NODE + EDGE
     SVG flow elements. Edges are drawn via GSAP strokeDashoffset.
  -------------------------------------------------------------------------- */
  .flow-svg { position: absolute; left: 240px; top: 320px; display: block; }
  .node { fill: var(--panel); stroke: var(--hairline); stroke-width: 2; }
  .node-active { stroke: var(--accent); stroke-width: 4; }
  .edge { fill: none; stroke: var(--accent); stroke-width: 4;
          stroke-dasharray: 600; stroke-dashoffset: 600; /* drawn by GSAP */ }
  .nlabel { font-family: "Segoe UI", system-ui, sans-serif; font-size: 28px;
            fill: var(--ink); /* fade in with GSAP */ }
  .nsub { font-size: 20px; fill: var(--ink-dim); }

  /* --------------------------------------------------------------------------
     3. ANNOTATED UI MOCKUP (Solution Preview)
     Abstract UI cards, stat tiles, and attention callouts.
  -------------------------------------------------------------------------- */
  .ui-mockup {
    position: absolute; left: 360px; top: 240px; width: 1200px; height: 700px;
    background: var(--panel); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    border: 1px solid var(--hairline); display: flex; flex-direction: column;
  }
  .ui-header { height: 80px; border-bottom: 1px solid var(--hairline); padding: 0 40px; display: flex; align-items: center; font-size: 24px; font-weight: 600; }
  .ui-body { padding: 40px; display: flex; gap: 40px; }
  .stat-tile { flex: 1; height: 160px; border: 1px solid var(--hairline); border-radius: 8px; padding: 24px; }
  .stat-label { font-size: 18px; color: var(--ink-dim); margin-bottom: 12px; }
  .stat-value { font-size: 48px; font-weight: 700; color: var(--ink); }
  
  /* Callout for UI attention */
  .callout-ring {
    position: absolute; width: 80px; height: 80px; border-radius: 50%;
    border: 4px solid var(--accent); box-sizing: border-box;
    /* Entrance: tl.fromTo(".callout-ring", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.2)" }, t); */
  }
  .callout-label {
    position: absolute; background: var(--accent); color: #fff;
    padding: 12px 24px; border-radius: 8px; font-size: 24px; font-weight: 600;
    box-shadow: 0 10px 20px rgba(0,120,212,0.2);
    /* Entrance: tl.fromTo(".callout-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, t); */
  }
</style>
</head>
<body>

<div class="component-section">
  <h2>1. Step Scene Header</h2>
  <div class="canvas">
    <div class="chip">01</div>
    <div class="step-title">Signals come in</div>
  </div>
</div>

<div class="component-section">
  <h2>2. Flow Diagram</h2>
  <div class="canvas">
    <svg class="flow-svg" width="1440" height="560" viewBox="0 0 1440 560">
      <rect class="node" x="40"  y="220" width="300" height="120" rx="16"/>
      <text class="nlabel" x="110" y="280">Ingest API</text>
      <text class="nsub" x="110" y="310">10,000 req/sec</text>

      <!-- gsaps to strokeDashoffset: 0 -->
      <polyline class="edge" id="edge-sample" points="340,280 570,280"/>

      <rect class="node node-active" x="570" y="220" width="300" height="120" rx="16"/>
      <text class="nlabel" x="640" y="280">Validator</text>
      <text class="nsub" x="640" y="310">Schema check</text>
    </svg>
  </div>
</div>

<div class="component-section">
  <h2>3. Annotated UI Mockup (Solution Preview)</h2>
  <div class="canvas">
    <div class="ui-mockup">
      <div class="ui-header">Patient Dashboard</div>
      <div class="ui-body">
        <div class="stat-tile">
          <div class="stat-label">Active Alerts</div>
          <div class="stat-value" style="color: var(--warning);">12</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Processed</div>
          <div class="stat-value">1,402</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">System Health</div>
          <div class="stat-value" style="color: var(--success);">100%</div>
        </div>
      </div>
      <!-- Absolute positioned relative to the mockup -->
      <div class="callout-ring" style="left: 60px; top: 180px;"></div>
      <div class="callout-label" style="left: 160px; top: 200px;">Requires attention</div>
    </div>
  </div>
</div>

</body>
</html>
